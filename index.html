<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Журнал BingX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#08090b;--surface:#121418;--surface-2:#1a1d23;--surface-3:#262a32;--border:#22252c;--text:#f2f4f7;--muted:#8a919e;--accent:#3d7bfd;--accent-soft:rgba(61,123,253,.16);--pos:#1fc16b;--pos-soft:rgba(31,193,107,.14);--neg:#f04d4d;--neg-soft:rgba(240,77,77,.14);--warn:#f5a524;--warn-soft:rgba(245,165,36,.15);--nav:rgba(20,22,27,.88);--shadow:0 10px 30px rgba(0,0,0,.5);--chat-bg:#0e1621;--bubble:#182533;--bubble-me:#2b5278;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f2f3f6;--surface:#fff;--surface-2:#f3f5f8;--surface-3:#e3e7ed;--border:#e2e5ea;--text:#0f1115;--muted:#5f6673;--accent:#2563eb;--accent-soft:rgba(37,99,235,.12);--pos:#0f9d58;--pos-soft:rgba(15,157,88,.12);--neg:#d93636;--neg-soft:rgba(217,54,54,.11);--warn:#c27c0e;--warn-soft:rgba(194,124,14,.13);--nav:rgba(255,255,255,.92);--shadow:0 10px 30px rgba(15,17,21,.12);--chat-bg:#dfe7ec;--bubble:#fff;--bubble-me:#e1f7cf;color-scheme:light}}
:root[data-theme="light"]{--bg:#f2f3f6;--surface:#fff;--surface-2:#f3f5f8;--surface-3:#e3e7ed;--border:#e2e5ea;--text:#0f1115;--muted:#5f6673;--accent:#2563eb;--accent-soft:rgba(37,99,235,.12);--pos:#0f9d58;--pos-soft:rgba(15,157,88,.12);--neg:#d93636;--neg-soft:rgba(217,54,54,.11);--warn:#c27c0e;--warn-soft:rgba(194,124,14,.13);--nav:rgba(255,255,255,.92);--shadow:0 10px 30px rgba(15,17,21,.12);--chat-bg:#dfe7ec;--bubble:#fff;--bubble-me:#e1f7cf;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
body{font-size:14px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 0 10px;background:linear-gradient(var(--bg) 75%,transparent)}
.title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.subt{font-size:12px;color:var(--muted)}
.icon-btn{position:relative;width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:17px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card-t{font-size:13px;color:var(--muted);font-weight:500}
.send{flex:none;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);border-radius:8px;font-size:12px;padding:4px 8px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big.md{font-size:24px}
.unit{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--muted)}.b{font-weight:700}
.sm{font-size:12px}.mt6{margin-top:6px}.mt10{margin-top:10px}.mt12{margin-top:12px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}.right{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.grid2 .card{margin-top:0}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:7px 0;border-radius:8px;font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.seg.small button{padding:5px 0;font-size:12px}
.seg.per button{font-size:12px;padding:7px 0}
.kv label{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:block;min-width:0}
input[type=date]{width:100%;background:transparent;border:0;color:var(--text);font:inherit;font-weight:600;font-size:15px;padding:2px 0}
a{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.pos{background:var(--pos-soft);color:var(--pos)}.pill.neg{background:var(--neg-soft);color:var(--neg)}.pill.acc{background:var(--accent-soft);color:var(--accent)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.side{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;white-space:nowrap}
.side.pos{background:var(--pos-soft)}.side.neg{background:var(--neg-soft)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-top:12px}
.m{background:var(--surface-2);padding:9px 10px;min-width:0}
.ml{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mv{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}.ms{font-size:11px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{border-radius:12px;padding:12px;background:var(--surface-2);border:1px solid var(--border);min-width:0}
.tile.pos{background:var(--pos-soft);border-color:transparent}.tile.neg{background:var(--neg-soft);border-color:transparent}
.tile .tv{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tile.pos .tv{color:var(--pos)}.tile.neg .tv{color:var(--neg)}
th.sortable{cursor:pointer;user-select:none}
.cutt th,.cutt td{padding:7px 3px}.cutt th:first-child,.cutt td:first-child{padding-left:0}.cutt th:last-child,.cutt td:last-child{padding-right:0}
.cutt th.sortable i{margin-left:1px;font-size:9px}
.cutt td:first-child{white-space:normal;min-width:84px}
.cutt{font-size:12px}
th.sortable i{font-style:normal;opacity:.35;margin-left:2px;font-size:10px}
th.sortable.on{color:var(--text)}th.sortable.on i{opacity:1;color:var(--accent)}
.st{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.st.full{background:var(--surface-3);color:var(--muted)}.st.part{background:var(--warn-soft);color:var(--warn)}.st.open{background:var(--accent-soft);color:var(--accent)}
.year{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mon{border-radius:10px;background:var(--surface-2);padding:9px;border:1px solid transparent;text-align:left;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;font-variant-numeric:tabular-nums}
.mon .d{font-size:12px;color:var(--muted)}.mon .v{font-weight:700;font-size:15px}.mon .n{font-size:10.5px;color:var(--muted)}
.mon.has .d,.mon.has .n{color:var(--text);opacity:.75}
.mon.cur{border-color:var(--accent)}
.chart text{fill:var(--muted);font-size:10px;font-family:inherit;font-variant-numeric:tabular-nums}
.chart .ax{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.f-pos{fill:var(--pos)}.f-neg{fill:var(--neg)}.f-mute{fill:var(--surface-3)}
.s-pos{stroke:var(--pos)}.s-neg{stroke:var(--neg)}.s-acc{stroke:var(--accent)}.s-warn{stroke:var(--warn)}.s-track{stroke:var(--surface-3)}.s-grid{stroke:var(--border)}.s-text{stroke:var(--text)}
.gauge{width:100%;max-width:150px;display:block;margin:6px auto 0}
.gauge path{fill:none;stroke-width:11}
.gauge text{fill:var(--text);font-size:19px;font-weight:700;font-family:inherit}
.cap{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;margin-top:6px;white-space:nowrap}
.chart-wrap{position:relative}
.tip{position:absolute;top:-6px;transform:translateX(-50%);background:var(--surface-3);border-radius:8px;padding:5px 8px;font-size:11.5px;display:none;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);z-index:2}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
.hours{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.hc{height:30px;border-radius:6px;border:0;background:var(--surface-2);font-size:10px;color:var(--muted);padding:0}
.hc.act{color:var(--text);font-weight:600}
.best{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;font-size:12.5px}
.best div{display:flex;justify-content:space-between;padding:3px 0}
.lbl{font-size:11px;color:var(--muted);margin-bottom:2px}
.tbl-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
th{color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{padding-left:0}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:none;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:999px;padding:6px 11px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.err.on{background:var(--neg-soft);border-color:var(--neg);color:var(--neg)}
.tr{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;border:0;border-top:1px solid var(--border);background:none;text-align:left}
.tr:first-child{border-top:0}
.coin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.hold{font-size:11px;padding:1px 6px;border-radius:5px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.15fr);gap:4px}
.cal .h{font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.day,.wk{min-height:50px;border-radius:8px;background:var(--surface-2);padding:4px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-size:10px;border:1px solid transparent;min-width:0;overflow:hidden;text-align:left}
.day .d,.wk .d{color:var(--muted);font-size:10px}
.day .v,.wk .v{font-weight:700;font-size:10.5px;white-space:nowrap}
.day .n,.wk .n{font-size:9px;color:var(--muted)}
.day.blank{background:transparent}
.day,.wk{font-variant-numeric:tabular-nums}
.day.has .d,.day.has .n{color:var(--text);opacity:.72}
.day.has .v{color:var(--text)}
.day.today{border-color:var(--accent)}
.wk{background:var(--surface-3)}
.msum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.msum>div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.drow{display:grid;grid-template-columns:74px 1fr 64px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:12.5px}
.drow:first-child{border-top:0}
.dbar{height:6px;border-radius:3px;background:var(--surface-3);position:relative;overflow:hidden}
.dbar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.kv b{display:block;font-size:13.5px;margin-top:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kvs{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px;white-space:normal}
.sec{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px}
.tl{border-left:2px solid var(--surface-3);margin-left:6px;padding-left:14px}
.tl div{position:relative;display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.tl div:before{content:"";position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px;font:inherit;min-height:70px;resize:vertical}
.btn{flex:1;display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:15px}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.narrow{flex:none;width:auto;padding:13px 16px}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.range{position:relative;height:8px;border-radius:4px;background:var(--surface-3);margin:22px 0 6px}
.range .z{position:absolute;top:0;bottom:0}
.range .mk{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--text);border:3px solid var(--surface);transform:translate(-50%,-50%);transition:left .6s}
.range .en{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted);transform:translateX(-50%)}
.range .ml2{position:absolute;top:-19px;transform:translateX(-50%);font-size:10.5px;font-weight:600;white-space:nowrap;transition:left .6s}
.rl{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--text);font-variant-numeric:tabular-nums}
.rl span{display:flex;flex-direction:column}.rl span:nth-child(2){align-items:center}.rl span:last-child{align-items:flex-end}
.rl i{font-style:normal;font-size:10.5px;color:var(--muted)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));background:var(--nav);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:20px;display:flex;padding:6px;box-shadow:var(--shadow);z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);background:none;border:0;padding:6px 0;border-radius:14px;position:relative;min-width:0}
.nav button.on{color:var(--accent);background:var(--accent-soft)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:1px;left:calc(50% + 5px);background:var(--neg);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px;line-height:16px;text-align:center}
.icon-btn .badge{top:-5px;left:auto;right:-5px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:70}
.fulltbl{font-size:11px}.fulltbl th,.fulltbl td{padding:5px 6px}
.ov.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-bottom:0;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--surface-3);margin:4px auto 12px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--surface-3);color:var(--text);padding:10px 14px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:80;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.navb{border:1px solid var(--border);background:var(--surface-2);width:30px;height:30px;border-radius:9px;color:var(--muted)}
.navb:disabled{opacity:.35}
@media (max-width:370px){.tsnap{font-size:10px}.tsnap .st{font-size:9px;padding:1px 4px}}
@media (max-width:360px){.big{font-size:26px}.mv{font-size:14.5px}.cal{gap:3px}.day .v,.wk .v{font-size:9.5px}}

.cols>.span2>.card{margin-top:12px}
.narrow-col{max-width:720px;margin:0 auto}
.btn:disabled{opacity:.6}
@media (min-width:900px){
.app{max-width:1180px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start;margin-top:12px}
.cols>.card,.cols>.span2>.card{margin-top:0}
.cols>.span2{grid-column:1/-1}
.poscards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.poscards>.card{margin-top:12px}
.nav{width:min(620px,calc(100% - 32px))}
.sheet{max-width:640px}
}
.state{text-align:center;padding:48px 16px;color:var(--muted)}
.state b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.state .btn{max-width:240px;margin:18px auto 0}
.stale{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:7px 10px;margin-bottom:10px}
.foot{font-size:11px;color:var(--muted);text-align:center;margin:18px 0 0}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--accent);margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="title">Журнал BingX</div><div class="subt" id="upd">загрузка…</div></div>
    <div class="row gap6"><button class="icon-btn" data-act="reload" aria-label="Обновить">↻</button></div>
  </header>
  <main id="view"><div class="state"><div class="spin"></div>Загружаю журнал…</div></main>
  <div class="foot" id="foot"></div>
</div>
<nav class="nav" id="nav" hidden>
  <button data-act="tab" data-tab="dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Дашборд</button>
  <button data-act="tab" data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календарь</button>
  <button data-act="tab" data-tab="trades"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Сделки</button>
  <button data-act="tab" data-tab="pos"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Позиции<span class="badge" id="posBadge" hidden></span></button>
  <button data-act="tab" data-tab="mark"><svg viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></svg>Разметка<span class="badge" id="markBadge" hidden></span></button>
</nav>
