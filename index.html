<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Журнал BingX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#08090b;--surface:#121418;--border:#22252c;--text:#f2f4f7;--muted:#8a919e;--accent:#3d7bfd;--pos:#1fc16b;--neg:#f04d4d;color-scheme:dark}
@media (prefers-color-scheme: light){:root{--bg:#f2f3f6;--surface:#fff;--border:#e2e5ea;--text:#0f1115;--muted:#5f6673;--accent:#2563eb;--pos:#0f9d58;--neg:#d93636;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.card{max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 12px;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border)}
.row b{text-align:right}
.ok{color:var(--pos)}.no{color:var(--neg)}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <h1>Журнал BingX</h1>
  <p>Приложение готовится. Эта страница проверяет, что хостинг и кнопка в Telegram работают.</p>
  <div class="row"><span>Страница загружена</span><b class="ok">да</b></div>
  <div class="row"><span>Открыта внутри Telegram</span><b id="inTg">—</b></div>
  <div class="row"><span>Версия Telegram WebApp</span><b id="ver">—</b></div>
  <div class="row"><span>Платформа</span><b id="plat">—</b></div>
  <div class="row"><span>Тема Telegram</span><b id="theme">—</b></div>
  <div class="row"><span>Сборка страницы</span><b>placeholder-2</b></div>
  <button id="close" hidden>Закрыть</button>
</div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var inside = !!(tg && tg.initData);
  var el = function (id) { return document.getElementById(id); };
  el('inTg').textContent = inside ? 'да' : 'нет';
  el('inTg').className = inside ? 'ok' : 'no';
  if (!tg || !inside) return;
  tg.ready();
  tg.expand();
  el('ver').textContent = tg.version || '—';
  el('plat').textContent = tg.platform || '—';
  el('theme').textContent = tg.colorScheme === 'light' ? 'светлая' : tg.colorScheme === 'dark' ? 'тёмная' : '—';
  el('close').hidden = false;
  el('close').onclick = function () { tg.close(); };
})();
</script>
</body>
</html>
